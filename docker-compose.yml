version: '3.8'

services:
  exchange-db:
    image: postgres:15-alpine
    container_name: exchange-db
    shm_size: '512mb'
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - ./jvm/src/main/resources/db-schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated Aeron Media Driver (The only one running as a driver)
  media-driver:
    build: .
    container_name: media-driver
    shm_size: '512mb'
    volumes:
      - /dev/shm:/dev/shm
    environment:
      MAIN_CLASS: "io.aeron.driver.MediaDriver"
    depends_on:
      exchange-db:
        condition: service_healthy

  matching-engine:
    build: .
    container_name: matching-engine
    shm_size: '512mb'
    volumes:
      - /dev/shm:/dev/shm
    environment:
      MAIN_CLASS: "com.exchange.MatchingServerKt"
      ARGS: "" # Run as client, no --embedded-driver
      AERON_CHANNEL: "aeron:ipc"
    depends_on:
      media-driver:
        condition: service_started
      exchange-db:
        condition: service_healthy

  ome:
    build: .
    container_name: ome
    shm_size: '512mb'
    volumes:
      - /dev/shm:/dev/shm
    environment:
      MAIN_CLASS: "com.exchange.OmeServerKt"
      ARGS: ""
      AERON_CHANNEL: "aeron:ipc"
    depends_on:
      media-driver:
        condition: service_started
      matching-engine:
        condition: service_started

  persistence-worker:
    build: .
    container_name: persistence-worker
    shm_size: '512mb'
    volumes:
      - /dev/shm:/dev/shm
    environment:
      MAIN_CLASS: "com.exchange.PersistenceWorkerKt"
      ARGS: ""
      DB_HOST: "exchange-db"
      AERON_CHANNEL: "aeron:ipc"
    depends_on:
      media-driver:
        condition: service_started
      exchange-db:
        condition: service_healthy

  gateway:
    build: .
    container_name: gateway
    shm_size: '512mb'
    ports:
      - "8080:8080"
    volumes:
      - /dev/shm:/dev/shm
    environment:
      MAIN_CLASS: "com.exchange.GatewayServerKt"
      ARGS: ""
      AERON_CHANNEL: "aeron:ipc"
    depends_on:
      media-driver:
        condition: service_started
      ome:
        condition: service_started
