# Rust Exchange Engine — K8s Deployments & Services
# Uses TCP JSON (no Aeron/shared memory needed)
#
# Startup order: exchange-db → persistence → matching-engine → ome → gateway
# TCP ports: ME=5555, OME=5556, Persistence=5557, OME-Feedback=5558, Gateway=8080

---
# ========== Persistence Worker ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-persistence
  template:
    metadata:
      labels:
        app: rust-persistence
    spec:
      initContainers:
        - name: wait-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z exchange-db 5432; do sleep 1; done']
      containers:
        - name: persistence
          image: exchange-engine-rust:latest
          command: ["persistence"]
          ports:
            - containerPort: 5557
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:pass@exchange-db:5432/exchange"
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-persistence
spec:
  ports:
    - port: 5557
      targetPort: 5557
  selector:
    app: rust-persistence

---
# ========== Matching Engine ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-matching-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-matching-engine
  template:
    metadata:
      labels:
        app: rust-matching-engine
    spec:
      initContainers:
        - name: wait-persistence
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rust-persistence 5557; do sleep 1; done']
      containers:
        - name: matching-engine
          image: exchange-engine-rust:latest
          command: ["me"]
          ports:
            - containerPort: 5555
            - containerPort: 5559
          env:
            - name: PERSISTENCE_ADDR
              value: "rust-persistence:5557"
            - name: OME_FEEDBACK_ADDR
              value: "rust-ome:5558"
            - name: ME_SNAPSHOT_LISTEN
              value: "0.0.0.0:5559"
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-matching-engine
spec:
  ports:
    - name: command
      port: 5555
      targetPort: 5555
    - name: snapshot
      port: 5559
      targetPort: 5559
  selector:
    app: rust-matching-engine

---
# ========== OME (Order Management Engine) ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-ome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-ome
  template:
    metadata:
      labels:
        app: rust-ome
    spec:
      initContainers:
        - name: wait-me
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rust-matching-engine 5555; do sleep 1; done']
        - name: wait-persistence
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rust-persistence 5557; do sleep 1; done']
      containers:
        - name: ome
          image: exchange-engine-rust:latest
          command: ["ome"]
          ports:
            - containerPort: 5556
            - containerPort: 5558
          env:
            - name: ME_ADDR
              value: "rust-matching-engine:5555"
            - name: PERSISTENCE_ADDR
              value: "rust-persistence:5557"
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-ome
spec:
  ports:
    - name: command
      port: 5556
      targetPort: 5556
    - name: feedback
      port: 5558
      targetPort: 5558
  selector:
    app: rust-ome

---
# ========== Gateway ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-gateway
  template:
    metadata:
      labels:
        app: rust-gateway
    spec:
      initContainers:
        - name: wait-ome
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rust-ome 5556; do sleep 1; done']
        - name: wait-me-snapshot
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rust-matching-engine 5559; do sleep 1; done']
      containers:
        - name: gateway
          image: exchange-engine-rust:latest
          command: ["gateway"]
          ports:
            - containerPort: 8080
          env:
            - name: OME_ADDR
              value: "rust-ome:5556"
            - name: ME_SNAPSHOT_ADDR
              value: "rust-matching-engine:5559"
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-gateway
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: rust-gateway
