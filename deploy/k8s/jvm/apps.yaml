apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-config
data:
  DB_HOST: "exchange-db"
  AERON_CHANNEL: "aeron:ipc"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange-stack
  template:
    metadata:
      labels:
        app: exchange-stack
    spec:
      initContainers:
        - name: wait-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z exchange-db 5432; do sleep 1; done']
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
      containers:
        - name: matching-engine
          image: exchange-engine:v-1773490500
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: MAIN_CLASS
              value: "com.exchange.MatchingServerKt"
            - name: ARGS
              value: "--embedded-driver" # ONLY ONE embedded driver
            - name: AERON_PUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }
            - name: AERON_SUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }

        - name: ome
          image: exchange-engine:v-1773490500
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: MAIN_CLASS
              value: "com.exchange.OmeServerKt"
            - name: ARGS
              value: ""
            - name: AERON_PUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }
            - name: AERON_SUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }

        - name: persistence-worker
          image: exchange-engine:v-1773490500
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: MAIN_CLASS
              value: "com.exchange.PersistenceWorkerKt"
            - name: ARGS
              value: ""
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: exchange-config, key: DB_HOST } }
            - name: AERON_PUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }
            - name: AERON_SUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }

        - name: gateway
          image: exchange-engine:v-1773490500
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: MAIN_CLASS
              value: "com.exchange.GatewayServerKt"
            - name: ARGS
              value: ""
            - name: AERON_PUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }
            - name: AERON_SUB_CHANNEL
              valueFrom: { configMapKeyRef: { name: exchange-config, key: AERON_CHANNEL } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  ports:
    - port: 8080
  selector:
    app: exchange-stack
